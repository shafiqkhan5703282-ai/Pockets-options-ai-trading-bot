<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spike AI Trading Bot Interface</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #ffffff;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Simulated Trading Chart Area */
        .chart-container {
            flex: 1;
            background: linear-gradient(135deg, #1b2838 0%, #0d1b2a 100%);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border-right: 2px solid #21262d;
        }

        .watermark {
            position: absolute;
            font-size: 8rem;
            color: rgba(255, 255, 255, 0.03);
            font-weight: bold;
            letter-spacing: 5px;
            pointer-events: none;
            user-select: none;
        }

        .chart-mockup {
            width: 80%;
            height: 60%;
            border-left: 2px dashed rgba(255,255,255,0.2);
            border-bottom: 2px dashed rgba(255,255,255,0.2);
            position: relative;
            display: flex;
            align-items: flex-end;
            padding: 10px;
        }

        .candle {
            flex: 1;
            margin: 0 3px;
            background: #238636;
            position: relative;
            transition: height 0.5s ease;
        }

        .candle.red {
            background: #da3633;
        }

        .candle::before {
            content: '';
            position: absolute;
            left: 50%;
            width: 2px;
            background: inherit;
            top: -10px;
            bottom: -10px;
            transform: translateX(-50%);
        }

        /* Bot Sidebar Panel */
        .bot-panel {
            width: 380px;
            background-color: #161b22;
            display: flex;
            flex-direction: column;
            border-left: 1px solid #30363d;
            box-shadow: -5px 0 15px rgba(0,0,0,0.5);
        }

        .bot-header {
            padding: 15px 20px;
            background-color: #21262d;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #30363d;
        }

        .bot-title {
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .bot-title span {
            color: #238636;
        }

        .bot-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .section-box {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
        }

        .section-title {
            font-size: 0.85rem;
            color: #8b949e;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        /* Market Info & Technical Indicators */
        .info-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.9rem;
            margin-bottom: 6px;
        }

        .info-row span:last-child {
            font-weight: 600;
        }

        .signal-display {
            text-align: center;
            padding: 15px;
            border-radius: 6px;
            font-size: 1.5rem;
            font-weight: bold;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .signal-buy {
            background-color: rgba(35, 134, 54, 0.2);
            color: #3fb950;
            border: 1px solid #238636;
        }

        .signal-sell {
            background-color: rgba(218, 54, 51, 0.2);
            color: #f85149;
            border: 1px solid #da3633;
        }

        /* Interactive Controls */
        .bot-controls {
            padding: 15px 20px;
            background-color: #21262d;
            border-top: 1px solid #30363d;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-primary {
            background-color: #238636;
            color: white;
        }

        .btn-secondary {
            background-color: #30363d;
            color: #c9d1d9;
        }

        select, input {
            width: 100%;
            padding: 8px;
            background: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 4px;
            margin-top: 4px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #3fb950;
            border-radius: 50%;
            box-shadow: 0 0 8px #3fb950;
        }
    </style>
</head>
<body>

    <!-- Simulated Main Screen / Chart -->
    <div class="chart-container">
        <div class="watermark">POCKET OPTION</div>
        <div style="position: absolute; top: 20px; left: 20px; font-size: 1.2rem; font-weight: bold;">
            EUR/USD OTC <span style="color: #3fb950;">+92%</span>
        </div>
        <div class="chart-mockup" id="chartMockup">
            <!-- Dynamic Candles Generated via JS -->
        </div>
    </div>

    <!-- Spike AI Bot Panel -->
    <div class="bot-panel">
        <div class="bot-header">
            <div class="bot-title">
                <span class="status-indicator"></span> Spike Bot <span>v4.1</span>
            </div>
            <div style="font-size: 0.8rem; color: #8b949e;" id="currentTime">18:00:00</div>
        </div>

        <div class="bot-body">
            <!-- Config Selection -->
            <div class="section-box">
                <div class="section-title">Bot Configuration</div>
                <label style="font-size: 0.8rem; color: #8b949e;">Market Type:</label>
                <select id="marketType">
                    <option value="OTC">OTC Market</option>
                    <option value="Stock">Stock Market</option>
                </select>
                
                <label style="font-size: 0.8rem; color: #8b949e; margin-top: 8px; display:block;">Currency Pair:</label>
                <select id="currencyPair">
                    <option value="EUR/USD OTC">EUR/USD OTC</option>
                    <option value="GBP/USD OTC">GBP/USD OTC</option>
                    <option value="AUD/NZD OTC">AUD/NZD OTC</option>
                    <option value="USD/JPY OTC">USD/JPY OTC</option>
                </select>

                <label style="font-size: 0.8rem; color: #8b949e; margin-top: 8px; display:block;">Expiration Time:</label>
                <select id="expTime">
                    <option value="1 minute">1 Minute</option>
                    <option value="5 seconds">5 Seconds</option>
                    <option value="5 minutes">5 Minutes</option>
                </select>
            </div>

            <!-- Market Analysis Data -->
            <div class="section-box">
                <div class="section-title">Technical Overview</div>
                <div class="info-row"><span>Volatility:</span> <span id="volatilityVal" style="color: #3fb950;">Above Average</span></div>
                <div class="info-row"><span>RSI Analysis:</span> <span id="rsiVal">Optimal (48%)</span></div>
                <div class="info-row"><span>MACD Status:</span> <span id="macdVal" style="color: #3fb950;">Bullish pressure</span></div>
                <div class="info-row"><span>Moving Average:</span> <span id="maVal">Support test</span></div>
            </div>

            <!-- Signal Generation Output -->
            <div class="section-box">
                <div class="section-title">AI Signal Engine</div>
                <div id="signalOutput" class="signal-display signal-buy">BUY</div>
                <div style="text-align: center; margin-top: 8px; font-size: 0.85rem; color: #8b949e;">
                    Signal Strength: <strong style="color: #fff;" id="signalStrength">90% (Optimal)</strong>
                </div>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="bot-controls">
            <button class="btn btn-primary" onclick="triggerNewSignal()">Request Another Signal</button>
            <button class="btn btn-secondary" onclick="resetBotConfig()">Reset Parameters</button>
        </div>
    </div>

    <script>
        // Live Clock Update
        setInterval(() => {
            const now = new Date();
            document.getElementById('currentTime').innerText = now.toTimeString().split(' ')[0];
        }, 1000);

        // Generate Simulated Candles
        const chartMockup = document.getElementById('chartMockup');
        function initChart() {
            chartMockup.innerHTML = '';
            for (let i = 0; i < 25; i++) {
                const candle = document.createElement('div');
                candle.className = 'candle' + (Math.random() > 0.5 ? ' red' : '');
                candle.style.height = (Math.floor(Math.random() * 70) + 20) + '%';
                chartMockup.appendChild(candle);
            }
        }
        initChart();

        // Simulate Dynamic Analysis & Signals matching video functionality ([00:00:27])
        function triggerNewSignal() {
            initChart();
            const signals = [
                { type: 'BUY', class: 'signal-buy', strength: '92% (Optimal)', rsi: 'Optimal (45%)', macd: 'Bullish pressure' },
                { type: 'SELL', class: 'signal-sell', strength: '85% (High)', rsi: 'Overbought (78%)', macd: 'Bearish divergence' },
                { type: 'BUY', class: 'signal-buy', strength: '88% (Strong)', rsi: 'Oversold (22%)', macd: 'Bullish crossover' }
            ];
            
            const randomSignal = signals[Math.floor(Math.random() * signals.length)];
            const signalBox = document.getElementById('signalOutput');
            
            signalBox.className = `signal-display ${randomSignal.class}`;
            signalBox.innerText = randomSignal.type;
            document.getElementById('signalStrength').innerText = randomSignal.strength;
            document.getElementById('rsiVal').innerText = randomSignal.rsi;
            document.getElementById('macdVal').innerText = randomSignal.macd;
        }

        function resetBotConfig() {
            document.getElementById('marketType').selectedIndex = 0;
            document.getElementById('currencyPair').selectedIndex = 0;
            document.getElementById('expTime').selectedIndex = 0;
            triggerNewSignal();
        }
    </script>
</body>
</html>
